# hub·modern, on the same machine as Pangolin. Full walkthrough: README.md → "Set up".
#
# The hub has no published port: the only way in is through Pangolin (with SSO), and it talks
# to Pangolin's API over Docker's internal network, so the API never faces the internet.

services:
  hub-modern:
    image: ghcr.io/armistice-group/hub-modern:latest
    container_name: hub-modern
    restart: unless-stopped
    environment:
      # Pangolin's Integration API, reached by container name over the shared network.
      PANGOLIN_API_URL: http://pangolin:3003/v1
      # From .env (step 2 of the README). Read-only: "List Resources" permission only.
      PANGOLIN_API_KEY: ${PANGOLIN_API_KEY:?put PANGOLIN_API_KEY in .env next to this file}
      # Your org's ID: the first part of the path in Pangolin's dashboard URL (…/<org-id>/settings).
      PANGOLIN_ORG_ID: ${PANGOLIN_ORG_ID:?put PANGOLIN_ORG_ID in .env next to this file}
    volumes:
      # Optional extras: links that aren't in Pangolin, icon and group overrides.
      - ./services.yaml:/data/services.yaml:ro
    networks:
      - pangolin

networks:
  pangolin:
    # Pangolin's Docker network. Newer installs call it pangolin_frontend, older ones pangolin:
    # step 3 of the README shows how to check; PANGOLIN_NETWORK in .env overrides it.
    name: ${PANGOLIN_NETWORK:-pangolin_frontend}
    external: true
